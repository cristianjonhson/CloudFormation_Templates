# =============================================================
# Template: 02-ec2-security-group-elastic-ip.yaml
# Descripcion: Lanza una instancia EC2 con dos Security Groups
#   y una Elastic IP (EIP) para mantener una IP publica fija.
# Parametros requeridos:
#   - SecurityGroupDescription: descripcion del grupo de servidor.
# Recursos creados:
#   - EC2 Instance
#   - Elastic IP (asociada a la instancia)
#   - Security Group SSH (puerto 22 abierto al mundo)
#   - Security Group Servidor (puertos 80 y 22 con restricciones)
# Outputs:
#   - ElasticIP: la IP publica fija asignada a la instancia
# =============================================================
---

# Parametros permiten personalizar el template en cada despliegue
# sin modificar el codigo fuente directamente.

# LatestAmiId: obtiene dinamicamente la AMI de Amazon Linux mas reciente usando un parametro de tipo AWS::SSM::Parameter::Value que referencia un parametro de SSM Parameter Store. Esto evita hardcodear IDs de AMI que pueden quedar obsoletos o no existir en otras regiones.
Parameters:
  LatestAmiId:
    Description: AMI dinamica de Amazon Linux via SSM Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

# AdminCidr: CIDR autorizado para acceso SSH administrativo para restringir el acceso SSH a IPs confiables.
  AdminCidr:
    Description: CIDR autorizado para acceso SSH administrativo (ej. 203.0.113.10/32)
    Type: String
    Default: 192.168.1.1/32

  SecurityGroupDescription:
    Description: Descripcion del grupo de seguridad
    Type: String

Resources:

  # Instancia EC2 que referencia ambos Security Groups.
  # !Ref resuelve el nombre logico del recurso al ID real en AWS.
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: !Ref LatestAmiId # AMI dinamica obtenida del parametro SSM
      InstanceType: t2.micro
      SecurityGroups:
        - !Ref SSHSecurityGroup    # Permite SSH desde cualquier IP
        - !Ref ServerSecurityGroup # Permite HTTP y SSH restringido

  # Elastic IP: IP publica estatica que no cambia al reiniciar la instancia.
  # Sin EIP, la IP publica de EC2 cambia cada vez que se para y se inicia.
  MyEIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref MyInstance # Asocia la EIP a la instancia EC2 creada arriba

  # Security Group de SSH: permite acceso por SSH (puerto 22) desde Internet.
  # El acceso queda restringido al CIDR definido por parametro.
  SSHSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Habilita el acceso SSH a traves del puerto 22
      SecurityGroupIngress:
      - CidrIp: !Ref AdminCidr # CIDR autorizado para acceso SSH administrativo
        FromPort: 22
        IpProtocol: tcp
        ToPort: 22

  # Security Group del servidor web:
  #   - Puerto 80 (HTTP) abierto al mundo para servir trafico web.
  #   - Puerto 22 (SSH) restringido al CIDR administrativo.
  # GroupDescription se toma del parametro SecurityGroupDescription.
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription # Descripcion personalizada via parametro
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0       # HTTP publico
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: !Ref AdminCidr  # SSH solo desde CIDR administrativo

# Outputs exponen valores del stack para consultarlos luego
# via consola, CLI o para pasarlos a otros stacks.
Outputs:
  ElasticIP:
    Description: Valor de la IP elastica
    Value: !Ref MyEIP # Ref al recurso EIP devuelve la IP publica asignada a la instancia
