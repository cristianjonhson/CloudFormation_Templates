AWSTemplateFormatVersion: '2010-09-09'
Resources:
  MyIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Cris
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: mys3-bucket2023
      AccessControl: PublicReadWrite
      

  MyS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: 
        Ref: MyS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal:  {
                "AWS": "*"
            }
            Action:
              - s3:GetObject
            Resource: 
              Fn::Join: 
                - ''
                - - 'arn:aws:s3:::'
                  - 
                    Ref: MyS3Bucket
                  - '/*'


