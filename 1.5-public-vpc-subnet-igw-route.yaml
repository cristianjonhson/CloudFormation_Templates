# =============================================================
# Template: 1.5-public-vpc-subnet-igw-route.yaml
# Descripcion: Crea una red publica minima para desplegar EC2
#   accesibles desde Internet dentro de una VPC.
# Recursos creados:
#   - VPC
#   - Public Subnet
#   - Internet Gateway
#   - VPC Gateway Attachment
#   - Route Table
#   - Default Route (0.0.0.0/0)
#   - Subnet Route Table Association
# Outputs:
#   - VpcId
#   - PublicSubnetId
#   - InternetGatewayId
#   - RouteTableId
# =============================================================
AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  VpcCidr:
    Description: CIDR block para la VPC
    Type: String
    Default: 10.0.0.0/16

  PublicSubnetCidr:
    Description: CIDR block para la subnet publica
    Type: String
    Default: 10.0.1.0/24

  AvailabilityZone:
    Description: Zona de disponibilidad para la subnet publica
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a

Resources:
  VpcPublic:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub cfn-lab-vpc-public-${AWS::StackName}

  SubnetPublic:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcPublic
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cfn-lab-subnet-public-${AWS::StackName}

  InternetGatewayPublic:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub cfn-lab-igw-public-${AWS::StackName}

  VpcInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcPublic
      InternetGatewayId: !Ref InternetGatewayPublic

  RouteTablePublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcPublic
      Tags:
        - Key: Name
          Value: !Sub cfn-lab-rtb-public-${AWS::StackName}

  RoutePublicDefault:
    Type: AWS::EC2::Route
    DependsOn: VpcInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTablePublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayPublic

  SubnetPublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublic
      RouteTableId: !Ref RouteTablePublic

Outputs:
  VpcId:
    Description: ID de la VPC creada
    Value: !Ref VpcPublic

  PublicSubnetId:
    Description: ID de la subnet publica creada
    Value: !Ref SubnetPublic

  InternetGatewayId:
    Description: ID de la Internet Gateway creada
    Value: !Ref InternetGatewayPublic

  RouteTableId:
    Description: ID de la route table publica
    Value: !Ref RouteTablePublic
