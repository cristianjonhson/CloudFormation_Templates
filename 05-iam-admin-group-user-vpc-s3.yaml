# =============================================================
# Template: 05-iam-admin-group-user-vpc-s3.yaml
# Descripcion: Configura un usuario de laboratorio de AWS mediante
#   un grupo IAM con politica minima declarativa, lo agrega al
#   grupo, y provisiona un bucket S3 y una VPC base.
# Recursos creados:
#   - IAM Group con permisos minimos para laboratorio
#   - IAM User (de laboratorio)
#   - Membresia usuario -> grupo (UserToGroupAddition)
#   - S3 Bucket
#   - VPC
# =============================================================
Resources:

  # Grupo IAM con politica minima para pruebas de S3 y lectura EC2.
  # Se evita AdministratorAccess para reducir riesgo de privilegios.
  IamGroupAdmin:
    Type: AWS::IAM::Group
    Properties:
      GroupName: cfn-lab-iam-group-admin
      Policies:
        - PolicyName: cfn-lab-iam-policy-limited-lab
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ListBuckets
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: '*'
              - Sid: S3BucketScopedAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketLab}
                  - !Sub arn:aws:s3:::${S3BucketLab}/*
              - Sid: Ec2ReadOnly
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeInstances
                Resource: '*'

  # Usuario IAM que sera miembro del grupo de administradores.
  # Los permisos se heredan del grupo, no se asignan directamente.
  IamUserAdmin:
    Type: AWS::IAM::User
    Properties:
      UserName: cfn-lab-iam-user-admin

  # UserToGroupAddition: agrega uno o mas usuarios a un grupo IAM.
  # Este recurso es la forma declarativa de asignar membresia;
  # equivale a: aws iam add-user-to-group.
  IamUserGroupMembershipAdmin:
    Type: AWS::IAM::UserToGroupAddition
    Properties:
      GroupName: !Ref IamGroupAdmin # Nombre del grupo destino
      Users:
        - Ref: IamUserAdmin     # Referencia al usuario creado arriba

  # Bucket S3 sin propiedades adicionales: CloudFormation generara
  # un nombre unico automaticamente. Sin AccessControl explicitico,
  # el bucket es privado por defecto.
  S3BucketLab:
    Type: AWS::S3::Bucket

  # VPC base con rango de IPs privadas 10.0.0.0/16.
  # Es el contenedor de red sobre el que se construiria
  # la infraestructura de subredes, rutas y gateways.
  VpcMain:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
