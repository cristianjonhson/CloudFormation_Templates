# =============================================================
# Template: 01-ec2-basic.yaml
# Descripcion: Template minimo que lanza una unica instancia EC2.
#   Es el punto de partida para aprender CloudFormation.
# Parametros requeridos:
#   - SubnetId: subnet donde se lanzara la instancia.
#   - LatestAmiId: AMI dinamica de Amazon Linux obtenida de SSM Parameter Store.
# Recursos creados:
#   - EC2 Instance (t2.micro)
# =============================================================
---

# Parametros del template.
Parameters:
  SubnetId:
    Description: ID de la subnet donde se lanzara la instancia EC2
    Type: AWS::EC2::Subnet::Id

  LatestAmiId:
    Description: AMI dinamica de Amazon Linux via SSM Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # Instancia EC2 basica sin red personalizada ni seguridad adicional.
  # AvailabilityZone: zona de disponibilidad donde se lanzara la instancia.
  # ImageId: AMI de Amazon Linux en us-east-1 (cambiar si se usa otra region).
  # InstanceType: t2.micro es elegible para la capa gratuita de AWS.
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Ref SubnetId
      ImageId: !Ref LatestAmiId # AMI dinamica obtenida del parametro SSM
      InstanceType: t2.micro
